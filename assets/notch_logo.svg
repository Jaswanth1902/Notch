<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-n-logo" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#181715" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#0E0D0D" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-n-logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7732"/>
    </linearGradient>
    <style>
      .serif-display { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Georgia', serif; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <rect width="400" height="400" fill="#080808"/>
  <rect width="400" height="400" fill="url(#vignette-n-logo)"/>

  <!-- Outer Border -->
  <rect x="16" y="16" width="368" height="368" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.4"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="3,5" stroke-opacity="0.25"/>

  <!-- Blueprint & Capsule Motif -->
  <g transform="translate(200, 200)" stroke="#C5A059" fill="none">
    <circle cx="0" cy="0" r="145" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="110" stroke-width="0.5" stroke-dasharray="2,4" stroke-opacity="0.25"/>
    <line x1="-155" y1="0" x2="155" y2="0" stroke-width="0.4" stroke-opacity="0.2"/>
    <line x1="0" y1="-155" x2="0" y2="155" stroke-width="0.4" stroke-opacity="0.2"/>

    <!-- Display Bezel Line -->
    <line x1="-120" y1="-70" x2="120" y2="-70" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="0" y="-78" fill="#C5A059" font-size="7" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.5">TOP EDGE BEZEL</text>

    <!-- Floating Capsule HUD Outline -->
    <rect x="-85" y="-70" width="170" height="46" rx="23" fill="#121110" stroke="url(#gold-n-logo)" stroke-width="1.2"/>
    <circle cx="-55" cy="-47" r="5" fill="#1A1816" stroke="#C5A059" stroke-width="0.6"/>
    <circle cx="-55" cy="-47" r="2" fill="#E5C77A" stroke="none"/>
    <rect x="-30" y="-54" width="95" height="14" rx="7" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="2,2"/>
    <text x="17" y="-44" fill="#E5C77A" font-size="7" text-anchor="middle" class="mono-tech" stroke="none">HUD ACTIVE</text>

    <!-- Luxury Monogram 'N' -->
    <text x="0" y="62" fill="#FDFBF7" font-size="82" text-anchor="middle" class="serif-display" stroke="none">N</text>

    <text x="0" y="95" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.7">N O T C H</text>
    <text x="0" y="108" fill="#C5A059" font-size="6" text-anchor="middle" class="mono-tech" stroke="none" opacity="0.4">WIN32 • 0.0% CPU</text>
  </g>
</svg>