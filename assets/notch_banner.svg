<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <radialGradient id="vignette-notch" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#161514" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0E0D0D" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="gold-notch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77A"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9B7732"/>
    </linearGradient>
    <style>
      .serif-title { font-family: 'Cinzel', 'Cormorant Garamond', 'Didot', 'Playfair Display', 'Baskerville', 'Georgia', serif; font-weight: 400; }
      .serif-sub { font-family: 'Cormorant Garamond', 'Baskerville', 'Georgia', serif; font-style: italic; }
      .mono-tech { font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" fill="#080808"/>
  <rect width="1200" height="420" fill="url(#vignette-notch)"/>

  <!-- Architectural Frame -->
  <rect x="24" y="24" width="1152" height="372" fill="none" stroke="#C5A059" stroke-width="0.75" stroke-opacity="0.35"/>
  <rect x="28" y="28" width="1144" height="364" fill="none" stroke="#C5A059" stroke-width="0.5" stroke-dasharray="4,6" stroke-opacity="0.2"/>

  <!-- Corner Rosettes -->
  <g stroke="#C5A059" stroke-width="0.8" opacity="0.6">
    <path d="M20 24 h16 M24 20 v16"/>
    <path d="M1180 24 h-16 M1176 20 v16"/>
    <path d="M20 396 h16 M24 392 v16"/>
    <path d="M1180 396 h-16 M1176 392 v16"/>
    <circle cx="24" cy="24" r="3" fill="none"/>
    <circle cx="1176" cy="24" r="3" fill="none"/>
    <circle cx="24" cy="396" r="3" fill="none"/>
    <circle cx="1176" cy="396" r="3" fill="none"/>
  </g>

  <!-- Architectural Blueprint of the Notch HUD Capsule (Left/Center Cluster) -->
  <g transform="translate(220, 205)" stroke="#C5A059" fill="none">
    <!-- Blueprint Radial Construction Lines -->
    <g stroke-width="0.4" stroke-opacity="0.15" stroke-dasharray="2,4">
      <circle cx="0" cy="0" r="160"/>
      <circle cx="0" cy="0" r="110"/>
      <line x1="-180" y1="0" x2="180" y2="0"/>
      <line x1="0" y1="-150" x2="0" y2="150"/>
    </g>

    <!-- Top Display Screen Edge Elevation -->
    <line x1="-160" y1="-80" x2="160" y2="-80" stroke="#C5A059" stroke-width="0.8" stroke-opacity="0.5"/>
    <text x="0" y="-90" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech" opacity="0.5">PRIMARY DISPLAY TOP BEZEL [winsta0\Default]</text>

    <!-- The Floating Capsule Blueprint (The Dynamic Island) -->
    <g stroke="url(#gold-notch)" stroke-width="1.2">
      <!-- Outer Capsule Shell -->
      <rect x="-110" y="-80" width="220" height="42" rx="21" fill="#121110" fill-opacity="0.8"/>
      <!-- Inner Indicator Glow / Camera Aperture -->
      <circle cx="-75" cy="-59" r="6" stroke-width="0.8" fill="#1E1C19"/>
      <circle cx="-75" cy="-59" r="2" fill="#E5C77A"/>
      <!-- Agent Status Pill -->
      <rect x="-45" y="-67" width="135" height="16" rx="8" stroke-width="0.6" stroke-dasharray="2,2"/>
      <text x="22" y="-55" fill="#E5C77A" font-size="8" text-anchor="middle" class="mono-tech">AUTONOMOUS RUNNING</text>
    </g>

    <!-- Dimension Callouts & Golden Ratio Arcs (Da Vinci Style) -->
    <g stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.6">
      <!-- Width Dimension Line -->
      <line x1="-110" y1="-25" x2="110" y2="-25"/>
      <line x1="-110" y1="-30" x2="-110" y2="-20"/>
      <line x1="110" y1="-30" x2="110" y2="-20"/>
      <text x="0" y="-18" fill="#C5A059" font-size="8" text-anchor="middle" class="mono-tech">WIDTH: 420px (EXPANDABLE)</text>

      <!-- Height Callout -->
      <line x1="125" y1="-80" x2="125" y2="-38"/>
      <line x1="120" y1="-80" x2="130" y2="-80"/>
      <line x1="120" y1="-38" x2="130" y2="-38"/>
      <text x="140" y="-56" fill="#C5A059" font-size="8" class="mono-tech">H: 34px</text>

      <!-- Radius Callout -->
      <path d="M-110,-59 A21,21 0 0,1 -89,-80" stroke-dasharray="2,3" stroke-width="0.8"/>
      <text x="-150" y="-45" fill="#C5A059" font-size="8" class="mono-tech">R: 17px (Φ)</text>
    </g>

    <!-- Technical Annotations -->
    <text x="-160" y="80" fill="#C5A059" opacity="0.4" font-size="9" class="mono-tech">FIG. II — ZERO-FOCUS WIN32 HUD</text>
    <text x="-160" y="100" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">WS_EX_TOOLWINDOW • 0.0% IDLE CPU</text>
    <text x="-160" y="120" fill="#C5A059" opacity="0.4" font-size="8" class="mono-tech">WS_EX_NOACTIVATE • HARDWARE ACCEL</text>
  </g>

  <!-- Typography & Presentation Hierarchy (Center-Right Cluster) -->
  <g transform="translate(460, 0)">
    <!-- Supertitle -->
    <text x="0" y="125" fill="#C5A059" font-size="12" letter-spacing="4" class="serif-title" opacity="0.85">
      AMBIENT DESKTOP AGENT HUD • WINDOWS 11
    </text>

    <!-- Main Title -->
    <text x="0" y="185" fill="#FDFBF7" font-size="54" letter-spacing="14" class="serif-title">
      N O T C H
    </text>

    <!-- Bohemian Divider -->
    <g transform="translate(0, 210)" stroke="#C5A059" opacity="0.6">
      <line x1="0" y1="0" x2="420" y2="0" stroke-width="0.8"/>
      <circle cx="210" cy="0" r="3" fill="#C5A059"/>
      <circle cx="105" cy="0" r="1.5" fill="#C5A059"/>
      <circle cx="315" cy="0" r="1.5" fill="#C5A059"/>
    </g>

    <!-- Subtitle -->
    <text x="0" y="245" fill="#C5BEB3" font-size="15" letter-spacing="2" class="serif-title" opacity="0.9">
      ZERO-FOCUS • HARDWARE ACCELERATED • NATIVE WIN32
    </text>

    <text x="0" y="275" fill="#8C857B" font-size="13" class="serif-sub">
      A lightweight Dynamic Island that renders AI execution state without stealing desktop focus.
    </text>

    <!-- Badges -->
    <g transform="translate(0, 315)">
      <rect x="0" y="0" width="125" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="62" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">&lt;25 MB RAM</text>

      <rect x="137" y="0" width="135" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="204" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">0.0% IDLE CPU</text>

      <rect x="284" y="0" width="150" height="24" rx="2" fill="#151311" stroke="#C5A059" stroke-width="0.6" stroke-opacity="0.4"/>
      <text x="359" y="16" fill="#C5A059" font-size="10" text-anchor="middle" class="mono-tech">SHIFT+ENTER HOOK</text>
    </g>

    <text x="0" y="365" fill="#5C564E" font-size="9" letter-spacing="2" class="mono-tech">
      ENGINEERED FOR WORKFLOW EFFICIENCY • ANNO MMXXVI • OPEN ATELIER
    </text>
  </g>
</svg>